services:
  # Public website
  - type: web
    name: vrmengineering
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SANITY_PROJECT_ID
        value: bbl7h451
      - key: VITE_SANITY_DATASET
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Admin CMS: Sanity Studio at https://cms.vrmengineering.co.ke
  - type: web
    name: vrmengineering-cms
    runtime: static
    rootDir: studio
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: SANITY_STUDIO_PROJECT_ID
        value: bbl7h451
      - key: SANITY_STUDIO_DATASET
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
